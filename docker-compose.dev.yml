services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doculens-backend-dev
    command: ["uvicorn", "app.api.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: development
      DEBUG: "true"
      QDRANT_LOCATION: ":memory:"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./app:/app/app
      - ./data:/app/data

  frontend:
    image: node:20-alpine
    container_name: doculens-frontend-dev
    working_dir: /app
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend




