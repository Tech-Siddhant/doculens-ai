<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 320' width='100%' height='100%' fill='none'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#070B14'/>
      <stop offset='100%' stop-color='#0E172A'/>
    </linearGradient>
    <linearGradient id='cg' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#1E293B'/>
      <stop offset='100%' stop-color='#111827'/>
    </linearGradient>
    <marker id='arr' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
      <path d='M 0 1 L 8 5 L 0 9 z' fill='#38BDF8'/>
    </marker>
    <marker id='arri' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
      <path d='M 0 1 L 8 5 L 0 9 z' fill='#818CF8'/>
    </marker>
    <marker id='arre' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
      <path d='M 0 1 L 8 5 L 0 9 z' fill='#34D399'/>
    </marker>
  </defs>

  <rect width='960' height='320' rx='14' fill='url(#bg)'/>
  <rect width='958' height='318' x='1' y='1' rx='13' fill='none' stroke='#1E293B' stroke-width='1.5'/>

  <text x='480' y='34' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
        font-size='17' font-weight='700' fill='#F8FAFC'>Hybrid Retrieval &amp; Reranking Pipeline</text>
  <text x='480' y='54' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
        font-size='11.5' font-weight='400' fill='#94A3B8'>Recall@5: 0.941  •  MRR@5: 0.852  (Hybrid + Rerank, gold_dataset.jsonl, N=105)</text>

  <!-- Query Box -->
  <g transform='translate(28, 90)'>
    <rect width='130' height='100' rx='8' fill='url(#cg)' stroke='#334155' stroke-width='1.2'/>
    <rect x='0' y='0' width='130' height='4' rx='2' fill='#94A3B8'/>
    <text x='65' y='30' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='11' font-weight='700' fill='#E2E8F0'>User Query</text>
    <text x='65' y='50' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>Natural language</text>
    <text x='65' y='65' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>question input</text>
    <text x='65' y='84' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#64748B'>+ doc_id filter</text>
  </g>

  <!-- Arrows from Query to three channels -->
  <path d='M 158,110 L 190,90' stroke='#38BDF8' stroke-width='1.5' marker-end='url(#arr)'/>
  <path d='M 158,140 L 190,140' stroke='#818CF8' stroke-width='1.5' marker-end='url(#arri)'/>
  <path d='M 158,168 L 190,190' stroke='#34D399' stroke-width='1.5' marker-end='url(#arre)'/>

  <!-- Dense Channel -->
  <g transform='translate(192, 58)'>
    <rect width='148' height='65' rx='7' fill='url(#cg)' stroke='#38BDF8' stroke-width='1.2'/>
    <rect x='0' y='0' width='148' height='3' rx='1.5' fill='#38BDF8'/>
    <text x='74' y='22' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='11.5' font-weight='700' fill='#38BDF8'>Dense Semantic</text>
    <text x='74' y='38' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>BAAI/bge-small-en-v1.5</text>
    <text x='74' y='52' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9' fill='#64748B'>Cosine Similarity  w=0.50</text>
  </g>

  <!-- BM25 Channel -->
  <g transform='translate(192, 140)'>
    <rect width='148' height='65' rx='7' fill='url(#cg)' stroke='#818CF8' stroke-width='1.2'/>
    <rect x='0' y='0' width='148' height='3' rx='1.5' fill='#818CF8'/>
    <text x='74' y='22' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='11.5' font-weight='700' fill='#818CF8'>BM25 Sparse</text>
    <text x='74' y='38' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>Okapi BM25  (k1=1.2, b=0.75)</text>
    <text x='74' y='52' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9' fill='#64748B'>Token overlap match  w=0.30</text>
  </g>

  <!-- Visual Channel -->
  <g transform='translate(192, 222)'>
    <rect width='148' height='65' rx='7' fill='url(#cg)' stroke='#34D399' stroke-width='1.2'/>
    <rect x='0' y='0' width='148' height='3' rx='1.5' fill='#34D399'/>
    <text x='74' y='22' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='11.5' font-weight='700' fill='#34D399'>Visual Page</text>
    <text x='74' y='38' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>BAAI/bge-visualized-base</text>
    <text x='74' y='52' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9' fill='#64748B'>Page image Cosine  w=0.20</text>
  </g>

  <!-- Arrows to Fusion -->
  <path d='M 340,90 L 380,140' stroke='#38BDF8' stroke-width='1.5' marker-end='url(#arr)'/>
  <path d='M 340,172 L 380,160' stroke='#818CF8' stroke-width='1.5' marker-end='url(#arri)'/>
  <path d='M 340,254 L 380,178' stroke='#34D399' stroke-width='1.5' marker-end='url(#arre)'/>

  <!-- Fusion / RRF Box -->
  <g transform='translate(382, 118)'>
    <rect width='160' height='80' rx='7' fill='url(#cg)' stroke='#334155' stroke-width='1.2'/>
    <rect x='0' y='0' width='160' height='3' rx='1.5' fill='#475569'/>
    <text x='80' y='22' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='11.5' font-weight='700' fill='#F1F5F9'>Hybrid Fusion</text>
    <text x='80' y='39' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>Reciprocal Rank Fusion</text>
    <text x='80' y='53' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>RRF (k=60)</text>
    <text x='80' y='69' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9' fill='#64748B'>Candidates: top-20 per channel</text>
  </g>

  <!-- Arrow Fusion -> Reranker -->
  <path d='M 542,158 L 575,158' stroke='#64748B' stroke-width='1.5' stroke-dasharray='4 3' marker-end='url(#arr)'/>

  <!-- Reranker Box -->
  <g transform='translate(577, 118)'>
    <rect width='160' height='80' rx='7' fill='url(#cg)' stroke='#818CF8' stroke-width='1.5'/>
    <rect x='0' y='0' width='160' height='3' rx='1.5' fill='#818CF8'/>
    <text x='80' y='22' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='11.5' font-weight='700' fill='#818CF8'>Cross-Encoder Reranker</text>
    <text x='80' y='39' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>BAAI/bge-reranker-base</text>
    <text x='80' y='53' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>Full cross-attention scoring</text>
    <text x='80' y='69' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9' fill='#64748B'>[Q ↔ Doc] token-level attention</text>
  </g>

  <!-- Arrow Reranker -> Output -->
  <path d='M 737,158 L 775,158' stroke='#34D399' stroke-width='1.5' marker-end='url(#arre)'/>

  <!-- Output Box -->
  <g transform='translate(777, 105)'>
    <rect width='155' height='130' rx='7' fill='#071324' stroke='#34D399' stroke-width='1.5'/>
    <rect x='0' y='0' width='155' height='3' rx='1.5' fill='#34D399'/>
    <text x='77.5' y='22' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='11.5' font-weight='700' fill='#34D399'>Grounded Evidence</text>
    <text x='77.5' y='38' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>Top-5 ranked candidates</text>
    <text x='77.5' y='56' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9' fill='#64748B'>Recall@5: 0.941</text>
    <text x='77.5' y='70' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9' fill='#64748B'>MRR@5:    0.852</text>
    <text x='77.5' y='88' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>chunk_id, page_number</text>
    <text x='77.5' y='102' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9.5' fill='#94A3B8'>evidence text + image URL</text>
    <text x='77.5' y='118' text-anchor='middle' font-family='-apple-system, BlinkMacSystemFont, sans-serif'
          font-size='9' fill='#64748B'>sources: [dense, bm25, visual]</text>
  </g>

  <!-- legend labels -->
  <g transform='translate(30, 285)'>
    <circle cx='8' cy='8' r='5' fill='#38BDF8'/>
    <text x='18' y='12' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='10' fill='#94A3B8'>Dense</text>
    <circle cx='80' cy='8' r='5' fill='#818CF8'/>
    <text x='90' y='12' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='10' fill='#94A3B8'>BM25 Sparse</text>
    <circle cx='175' cy='8' r='5' fill='#34D399'/>
    <text x='185' y='12' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='10' fill='#94A3B8'>Visual</text>
    <circle cx='245' cy='8' r='5' fill='#475569'/>
    <text x='255' y='12' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='10' fill='#94A3B8'>Fusion (RRF)</text>
    <circle cx='345' cy='8' r='5' fill='#818CF8'/>
    <text x='355' y='12' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='10' fill='#94A3B8'>Reranker</text>
  </g>
</svg>
