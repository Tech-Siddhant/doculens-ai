    <text x="18" y="34" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8">Synthetic / offline regression benchmark · 55 gold queries · 10 technical documents (data/gold_dataset.jsonl)</text>
  </g>

