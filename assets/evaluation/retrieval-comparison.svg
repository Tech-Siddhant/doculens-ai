    <line x1="120" y1="235" x2="400" y2="235" stroke="#334155" stroke-width="1"/>

    <!-- Row 1: dense -->
    <text x="18" y="76" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">dense</text>
