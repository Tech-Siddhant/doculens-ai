services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doculens-backend
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: production
      DEBUG: "false"
      UPLOAD_DIR: data/uploads
      RENDER_OUTPUT_DIR: data/rendered_pages
      QDRANT_LOCATION: ":memory:"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.7-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - doculens_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: doculens-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  doculens_data:




